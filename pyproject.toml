[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-output-repairer"
version = "0.1.0"
description = "Conservative deterministic recovery of malformed JSON model output"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sor = "structured_output_repairer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["structured_output_repairer*"]
